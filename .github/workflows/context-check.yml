name: Context checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate context structure and ADR metadata
        run: python3 scripts/check_context.py
      - name: Run checker self-tests
        run: python3 -m unittest discover -s tests -v
